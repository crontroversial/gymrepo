<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Testwebsite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background-color: #D1DCFF;

      font-family: 'Fredoka', sans-serif;
    }


    /* ÜBERSCHRIFT */

    .site-title {
      margin: 0;
      padding-top: 55px;

      text-align: center;

      color: #91A2D9;

      font-size: clamp(70px, 10vw, 130px);
      font-weight: 700;

      letter-spacing: -2px;
      line-height: 0.9;

      text-transform: uppercase;
    }


    /* HERZ-BEREICH */

    .heart-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;

      margin-top: 100px;
    }


    /* HERZ */

    .heart-button {
      position: relative;

      display: block;

      width: 430px;
      height: 390px;

      padding: 0;

      background: transparent;

      text-decoration: none;
      color: inherit;

      cursor: pointer;

      transition: transform 0.2s ease;
    }


    /* SVG-HERZ */

    .heart-button svg {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;
    }


    /* TEXT IM HERZ */

    .heart-text {
      position: absolute;

      top: 47%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 260px;

      color: white;

      font-size: 30px;
      font-weight: 600;

      line-height: 1.15;

      text-align: center;

      z-index: 2;
    }


    /* HOVER */

    .heart-button:hover {
      transform: scale(1.05);
    }

  </style>
</head>


<body>

  <h1 class="site-title">
    TESTWEBSITE
  </h1>


  <div class="heart-wrapper">

    <a
      class="heart-button"
      href="welcome.html"
      aria-label="Schön, dass Du da bist!"
    >

      <svg
        viewBox="0 0 500 450"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >

        <path
          fill="#91A2D9"
          d="
            M250 420
            C220 390 45 275 45 135
            C45 55 105 20 165 20
            C205 20 235 43 250 75
            C265 43 295 20 335 20
            C395 20 455 55 455 135
            C455 275 280 390 250 420
            Z
          "
        />

      </svg>


      <span class="heart-text">
        Schön, dass Du<br>
        da bist!
      </span>

    </a>

  </div>

</body>

</html>
