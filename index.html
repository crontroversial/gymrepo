<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Testwebsite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* GRUNDEINSTELLUNGEN */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background-color: #D1DCFF;

      font-family: 'Fredoka', sans-serif;
    }


    /* ÜBERSCHRIFT */

    .site-title {
      margin: 0;

      padding-top: 55px;

      text-align: center;

      color: #91A2D9;

      font-size: clamp(70px, 10vw, 130px);
      font-weight: 700;

      letter-spacing: -2px;
      line-height: 0.9;

      text-transform: uppercase;
    }


    /* HERZ-BEREICH */

    .heart-wrapper {
      display: flex;

      justify-content: center;
      align-items: center;

      margin-top: 110px;
    }


    /* HERZ */

    .heart-button {
      width: 430px;
      height: 390px;

      padding: 0;

      border: none;

      background-color: #91A2D9;

      clip-path: path(
        "M 215 375
         C 190 350, 35 235, 35 125
         C 35 50, 90 15, 145 15
         C 180 15, 205 35, 215 60
         C 225 35, 250 15, 285 15
         C 340 15, 395 50, 395 125
         C 395 235, 240 350, 215 375
         Z"
      );

      cursor: pointer;

      display: flex;

      justify-content: center;
      align-items: center;

      transition: transform 0.2s ease;
    }


    /* TEXT IM HERZ */

    .heart-button span {
      display: block;

      width: 260px;

      margin-top: -15px;

      color: white;

      font-family: 'Fredoka', sans-serif;

      font-size: 30px;
      font-weight: 600;

      line-height: 1.15;

      text-align: center;
    }


    /* KLEINER HOVER-EFFEKT */

    .heart-button:hover {
      transform: scale(1.05);
    }


    /* HANDY */

    @media (max-width: 600px) {

      .site-title {
        padding-top: 40px;

        font-size: 15vw;
      }

      .heart-wrapper {
        margin-top: 100px;
      }

      .heart-button {
        transform: scale(0.8);
      }

      .heart-button:hover {
        transform: scale(0.84);
      }
    }

  </style>
</head>


<body>

  <h1 class="site-title">
    TESTWEBSITE
  </h1>


  <div class="heart-wrapper">

    <button
      class="heart-button"
      type="button"
      aria-label="Schön, dass Du da bist!"
    >

      <span>
        Schön, dass Du<br>
        da bist!
      </span>

    </button>

  </div>

</body>

</html>
