  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #D1DCFF;
      font-family: 'Fredoka', sans-serif;
    }


    /* ÜBERSCHRIFT */

    .site-title {
      margin: 0;
      padding-top: 55px;

      text-align: center;

      color: #91A2D9;

      font-size: clamp(55px, 7vw, 95px);
      font-weight: 700;

      letter-spacing: -2px;
      line-height: 0.95;

      text-transform: uppercase;
    }


    /* HERZ-GRID */

    .heart-grid {
      width: min(1100px, 90%);

      margin: 90px auto 0;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      column-gap: 35px;
      row-gap: 45px;

      justify-items: center;
    }


    /* EINZELNES HERZ */

    .heart-button {
      position: relative;

      display: block;

      width: 230px;
      height: 205px;

      background: transparent;
      text-decoration: none;

      cursor: pointer;

      transition: transform 0.2s ease;
    }


    /* HERZFORM */

    .heart-button svg {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;
    }


    /* TEXT IM HERZ */

    .heart-text {
      position: absolute;

      top: 46%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 150px;

      color: white;

      font-size: 24px;
      font-weight: 600;

      line-height: 1;

      text-align: center;

      z-index: 2;
    }


    /* HOVER */

    .heart-button:hover {
      transform: scale(1.08);
    }


    /* TABLET */

    @media (max-width: 1000px) {

      .heart-grid {
        grid-template-columns: repeat(2, 1fr);

        width: 600px;
        max-width: 90%;
      }

    }


    /* HANDY */

    @media (max-width: 600px) {

      .site-title {
        padding-top: 40px;
        font-size: 13vw;
      }

      .heart-grid {
        grid-template-columns: repeat(2, 1fr);

        width: 95%;

        margin-top: 60px;

        column-gap: 10px;
        row-gap: 25px;
      }

      .heart-button {
        width: 165px;
        height: 150px;
      }

      .heart-text {
        width: 110px;
        font-size: 19px;
      }

    }

  </style>
</head>
